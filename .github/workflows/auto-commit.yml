name: Daily Auto Commit

permissions:
  contents: write

on:
  schedule:
    - cron: "7 0,5,7,10,11,12,15,16,19,20,22 * * *"

  workflow_dispatch:

concurrency:
  group: daily-auto-commit
  cancel-in-progress: false

jobs:
  auto_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Update Timestamp
        run: |
          echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" > LAST_UPDATED

      - name: Commit Changes
        run: |
          git config user.name "Chandan-1818"
          git config user.email "chandan895121@gmail.com"

          git add LAST_UPDATED

          messages=(
            "chore(bot): 🤖 auto commit"
            "chore(bot): 🚀 scheduled update"
            "chore(bot): ✨ periodic update"
            "chore(bot): 🔄 repository update"
            "chore(bot): 📅 daily sync"
            "chore(bot): 📝 update timestamp"
            "chore(bot): ⚡ maintenance"
            "chore(bot): 🌟 repository maintenance"
            "chore(bot): 🎯 automated update"
            "chore(bot): ✅ routine update"
          )

          random_index=$((RANDOM % ${#messages[@]}))

          git commit -m "${messages[$random_index]}" || echo "No changes to commit"

      - name: Push Changes
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main